name: verify

on:
  push:
  pull_request:
  workflow_dispatch:

jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: Validar manifiestos, JSON, corpus y portabilidad
        run: node tools/ci-validate.mjs

      - name: Verificar el bundle del idioma
        run: node tools/verify-client-bundle.mjs
